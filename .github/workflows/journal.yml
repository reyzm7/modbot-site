# Le journal des modifications, chaque nuit.
#
# La page « Nouveautés » se construit a partir de ce qui a ete livre :
# l'historique des deux depots, le site et le bot. Personne n'a a penser
# a la remplir, et rien n'y entre qui n'ait ete pousse.
#
# ── Pourquoi la garde ne regarde PAS l'heure ──────────────────────────
#
# La premiere version demandait qu'il soit exactement minuit a Paris,
# avec deux crons pour couvrir l'ete et l'hiver. Elle n'a jamais laisse
# passer une seule execution : GitHub ne promet pas l'heure de ses
# crons, et les huit premieres nuits sont parties entre 00 h 30 et
# 02 h 30 UTC, soit deux a quatre heures apres l'heure demandee. La
# garde refusait donc toujours, et la page n'a pas ete ecrite une fois.
#
# Le bon critere n'est pas « quelle heure est-il » mais « a-t-on deja
# ecrit aujourd'hui ». Il est vrai quel que soit le retard, il survit au
# changement d'heure, et il rend les deux crons inoffensifs : le premier
# qui passe ecrit, le second voit que c'est fait et s'arrete.
#
# Le jour se compte a Paris, parce que c'est celui du lecteur — et le
# generateur date ses entrees de la meme facon.
name: Journal des modifications

on:
  schedule:
    # Deux departs, pour qu'un retard ou une file chargee ne fasse pas
    # sauter une nuit entiere. La garde empeche la double ecriture.
    - cron: "10 22 * * *"
    - cron: "10 23 * * *"
  workflow_dispatch:
    inputs:
      jours:
        description: "Combien de jours relire (defaut 2)"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  # Deux executions qui se croisent ecriraient la meme page en meme
  # temps, et la seconde pousserait sur un depot qui a bouge.
  group: journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - name: Le site
        uses: actions/checkout@v4
        with:
          path: modbot-site
          # Le generateur lit « git log », et la garde cherche le dernier
          # commit du journal : sans profondeur, ni l'un ni l'autre ne
          # voit quoi que ce soit.
          fetch-depth: 0

      - name: A-t-on deja ecrit aujourd'hui ?
        id: garde
        working-directory: modbot-site
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ok=oui" >> "$GITHUB_OUTPUT"
            echo "Lance a la main : on ecrit sans rien demander."
            exit 0
          fi
          jour=$(TZ=Europe/Paris date +%F)
          dernier=$(git log -1 --grep='^\[journal\]' --format=%cI || true)
          if [ -n "$dernier" ]; then
            jour_dernier=$(TZ=Europe/Paris date -d "$dernier" +%F)
          else
            jour_dernier="(jamais)"
          fi
          echo "Aujourd'hui a Paris : $jour"
          echo "Dernier journal     : $jour_dernier"
          if [ "$jour" = "$jour_dernier" ]; then
            echo "ok=non" >> "$GITHUB_OUTPUT"
            echo "Deja ecrit aujourd'hui : on s'arrete."
          else
            echo "ok=oui" >> "$GITHUB_OUTPUT"
          fi

      # Les nouveautes du bot interessent plus les lecteurs que celles du
      # site. Il est pose a cote, comme le fait deja la suite de tests.
      - name: Le bot, a cote
        if: steps.garde.outputs.ok == 'oui'
        uses: actions/checkout@v4
        with:
          repository: reyzm7/modbot
          path: modbot
          fetch-depth: 0

      - name: Ecrire la page
        if: steps.garde.outputs.ok == 'oui'
        working-directory: modbot-site
        run: |
          jours="${{ github.event.inputs.jours }}"
          [ -z "$jours" ] && jours=2
          node outils/journal.js --jours "$jours"

      - name: Pousser si quelque chose a change
        if: steps.garde.outputs.ok == 'oui'
        working-directory: modbot-site
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Rien de neuf : aucune modification depuis hier."
            exit 0
          fi
          git config user.name "journal ModBot"
          git config user.email "noreply@github.com"
          git add nouveautes.html outils/journal.json sitemap.xml
          # « [journal] » en tete : le generateur ecarte ses propres
          # commits, et la garde de demain les reconnait.
          git commit -m "[journal] Les nouveautes du $(TZ=Europe/Paris date +%d/%m/%Y)"
          # Le site a pu bouger entre le checkout et maintenant.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Pousse."
