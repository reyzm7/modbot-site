# Les tests du site, a chaque poussee.
#
# Ils existaient tous, et aucun ne tournait tout seul : il fallait y
# penser, depuis une machine ou Python est installe. Une semaine entiere
# a ete livree sans qu'aucune suite ne soit passee.
#
# Vercel deploie `main` au push. Ce fichier fait tourner les tests sur la
# meme poussee : le deploiement n'attend pas le resultat, mais l'onglet
# Actions dit en deux minutes si quelque chose a casse.
#
# UNE ETAPE PAR SUITE, deliberement : la liste des etapes se lit d'un
# coup d'oeil, et `if: always()` les fait toutes tourner meme apres un
# echec. Un premier rouge ne doit pas cacher les suivants.
#
# Chaque etape resume son echec en annotation : le journal complet
# demande une authentification pour etre lu, et une CI rouge qui ne dit
# que « exit code 1 » a deja coute trois lots de tatonnements.
name: Tests du site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Le site
        uses: actions/checkout@v4
        with:
          path: modbot-site

      # `test_derives.py` croise les listes que le site recopie du bot :
      # les fonctionnalites premium, les variables et modeles de
      # compteur. Sans le depot du bot a cote, ces croisements sont
      # sautes — et ce sont eux qui attrapent la derive.
      - name: Le bot, a cote
        uses: actions/checkout@v4
        with:
          repository: reyzm7/modbot
          path: modbot

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Rien a installer : les tests du site ne demandent que la
      # bibliotheque standard, et les deux modules du bot qu'ils
      # importent — `premium_core` et `compteurs` — n'ont eux non plus
      # aucune dependance. C'est ce qui les rend verifiables ici.
      - name: Traductions (test_i18n)
        if: always()
        working-directory: modbot-site
        run: |
          if python test_i18n.py > sortie.txt 2>&1; then
            cat sortie.txt
            rm -f sortie.txt
          else
            cat sortie.txt
            resume=$(grep -E "ECHEC|❌|Traceback|Error" sortie.txt | tail -n 20 \
                     | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test_i18n::${resume}"
            rm -f sortie.txt
            exit 1
          fi

      - name: Derives entre le site et le bot (test_derives)
        if: always()
        working-directory: modbot-site
        run: |
          if python test_derives.py > sortie.txt 2>&1; then
            cat sortie.txt
            rm -f sortie.txt
          else
            cat sortie.txt
            resume=$(grep -E "ECHEC|❌|Traceback|Error" sortie.txt | tail -n 20 \
                     | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test_derives::${resume}"
            rm -f sortie.txt
            exit 1
          fi

      - name: Noms declares (test_declarations)
        if: always()
        working-directory: modbot-site
        run: |
          if python test_declarations.py > sortie.txt 2>&1; then
            cat sortie.txt
            rm -f sortie.txt
          else
            cat sortie.txt
            resume=$(grep -E "ECHEC|❌|Traceback|Error" sortie.txt | tail -n 20 \
                     | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test_declarations::${resume}"
            rm -f sortie.txt
            exit 1
          fi

      - name: Selecteurs (test_selecteurs)
        if: always()
        working-directory: modbot-site
        run: |
          if python test_selecteurs.py > sortie.txt 2>&1; then
            cat sortie.txt
            rm -f sortie.txt
          else
            cat sortie.txt
            resume=$(grep -E "ECHEC|❌|Traceback|Error" sortie.txt | tail -n 20 \
                     | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test_selecteurs::${resume}"
            rm -f sortie.txt
            exit 1
          fi

      - name: Carte de bienvenue (test_bienvenue)
        if: always()
        working-directory: modbot-site
        run: |
          if python test_bienvenue.py > sortie.txt 2>&1; then
            cat sortie.txt
            rm -f sortie.txt
          else
            cat sortie.txt
            resume=$(grep -E "ECHEC|❌|Traceback|Error" sortie.txt | tail -n 20 \
                     | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test_bienvenue::${resume}"
            rm -f sortie.txt
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════════
  #  LE PARCOURS
  #
  #  Les cinq suites ci-dessus lisent des fichiers. Celle-ci ouvre les
  #  pages dans un vrai navigateur, dans les deux themes, sur telephone
  #  et avec la preference « reduire les animations ». Deux pannes lui
  #  doivent leur decouverte : un titre blanc peint sur du blanc, et un
  #  site entier fige par une regle universelle.
  #
  #  Son propre job : il telecharge Chromium, ce que les autres n'ont
  #  pas a payer, et son echec se lit separement.
  # ══════════════════════════════════════════════════════════════════
  parcours:
    runs-on: ubuntu-latest
    steps:
      - name: Le site
        uses: actions/checkout@v4
        with:
          path: modbot-site

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Le navigateur
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium

      - name: Servir le site
        working-directory: modbot-site
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/serveur.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/index.html > /dev/null && break
            sleep 0.5
          done

      - name: Le site ouvert pour de vrai (test_parcours)
        working-directory: modbot-site
        env:
          SITE_BASE: http://127.0.0.1:8000
        run: |
          if python test_parcours.py > sortie.txt 2>&1; then
            cat sortie.txt
            rm -f sortie.txt
          else
            cat sortie.txt
            resume=$(grep -E "ECHEC|Traceback|Error" sortie.txt | tail -n 20 \
                     | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test_parcours::${resume}"
            rm -f sortie.txt
            exit 1
          fi
